<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .arjs-video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; object-fit: cover !important; z-index: 0 !important; }
  a-scene, .a-canvas { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1 !important; background: transparent !important; background-color: transparent !important; }
  .hidden-video { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0.01; }
  /* Накладка для видео поверх AR — обычный HTML-элемент */
  #videoOverlay {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80vw; max-width: 600px; height: auto;
    z-index: 999998; display: none;
    background: #000; border: 2px solid #4fc3f7; border-radius: 8px;
  }
  #backBtn { position: fixed; top: 12px; left: 12px; z-index: 999999; padding: 10px 16px; border-radius: 20px; background: #000; color: #fff; border: 1px solid #4fc3f7; font-family: Arial, sans-serif; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <button id="backBtn" onclick="window.location.replace('index.html')">← Выйти</button>
  <video id="videoOverlay" controls playsinline webkit-playsinline></video>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; premultipliedAlpha: false;"
    style="width:100%; height:100%; background: transparent;">

    <a-marker type="pattern" url="1-building.patt" id="m1"></a-marker>
    <a-marker type="pattern" url="2-bridge.patt" id="m2"></a-marker>
    <a-marker type="pattern" url="3-electric.patt" id="m3"></a-marker>
    <a-marker type="pattern" url="4-robot.patt" id="m4"></a-marker>
    <a-marker type="pattern" url="5-vehicles.patt" id="m5"></a-marker>
    <a-marker type="pattern" url="6-mine.patt" id="m6"></a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var markerToVideo = {
      'm1': '1-building.mp4',
      'm2': '2-bridge.mp4',
      'm3': '3-electric.mp4',
      'm4': '4-robot.mp4',
      'm5': '5-vehicles.mp4',
      'm6': '6-mine.mp4'
    };

    var overlay = document.getElementById('videoOverlay');
    var currentMarker = null;

    Object.keys(markerToVideo).forEach(function(markerId) {
      var marker = document.getElementById(markerId);
      if (!marker) return;

      marker.addEventListener('markerFound', function() {
        if (currentMarker === markerId) return;
        currentMarker = markerId;

        overlay.src = markerToVideo[markerId];
        overlay.style.display = 'block';
        overlay.play().catch(function(e){ console.log('play:', e); });
      });

      marker.addEventListener('markerLost', function() {
        if (currentMarker !== markerId) return;
        currentMarker = null;
        overlay.pause();
        overlay.style.display = 'none';
      });
    });

    function fixARVideo() {
      document.querySelectorAll('video').forEach(function(v) {
        if (v.id === 'videoOverlay') return;
        v.style.position='fixed'; v.style.top='0'; v.style.left='0';
        v.style.width='100vw'; v.style.height='100vh';
        v.style.objectFit='cover'; v.style.zIndex='0';
      });
      document.querySelectorAll('canvas').forEach(function(c) {
        c.style.position='fixed'; c.style.top='0'; c.style.left='0';
        c.style.width='100vw'; c.style.height='100vh';
        c.style.zIndex='1'; c.style.background='transparent'; c.style.backgroundColor='transparent';
      });
    }
    setTimeout(fixARVideo, 500);
    setTimeout(fixARVideo, 1500);
    setTimeout(fixARVideo, 3000);
    window.addEventListener('load', fixARVideo);
    window.addEventListener('resize', fixARVideo);
  </script>
</body>
</html>
