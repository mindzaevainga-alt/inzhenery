<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .arjs-video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; object-fit: cover !important; z-index: 0 !important; }
  a-scene, .a-canvas { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1 !important; background: transparent !important; background-color: transparent !important; }
  .hidden-video { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0.01; }
  #backBtn { position: fixed; top: 12px; left: 12px; z-index: 999999; padding: 10px 16px; border-radius: 20px; background: #000; color: #fff; border: 1px solid #4fc3f7; font-family: Arial, sans-serif; font-size: 14px; cursor: pointer; }
  #playBtn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 999999; padding: 14px 28px; border-radius: 25px; background: #4fc3f7; color: #0d1b2a; border: none; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; display: none; }
  #tapHint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999998; padding: 16px 24px; border-radius: 12px; background: rgba(0,0,0,0.7); color: #4fc3f7; border: 2px solid #4fc3f7; font-family: Arial, sans-serif; font-size: 15px; text-align: center; pointer-events: none; }
</style>
</head>
<body>
  <button id="backBtn" onclick="window.location.replace('index.html')">← Выйти</button>
  <button id="playBtn">▶️ Включить видео</button>
  <div id="tapHint">Коснитесь экрана,<br>чтобы разрешить видео</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; premultipliedAlpha: false;"
    style="width:100%; height:100%; background: transparent;">

    <a-entity id="markerContainer"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var markers = {
      '1-building': '1-building.mp4',
      '2-bridge': '2-bridge.mp4',
      '3-electric': '3-electric.mp4',
      '4-robot': '4-robot.mp4',
      '5-vehicles': '5-vehicles.mp4',
      '6-mine': '6-mine.mp4'
    };

    var container = document.getElementById('markerContainer');
    var activeVideo = null;
    var activeMarkerName = null;
    var playBtn = document.getElementById('playBtn');
    var tapHint = document.getElementById('tapHint');
    var userInteracted = false;

    // Первое касание экрана — разрешает автоплей
    document.body.addEventListener('touchstart', function() {
      userInteracted = true;
      tapHint.style.display = 'none';
      if (activeVideo && activeVideo.paused) {
        activeVideo.play().catch(function(e){ console.log('play on tap:', e); });
      }
    }, { once: false });

    document.body.addEventListener('click', function() {
      userInteracted = true;
      tapHint.style.display = 'none';
      if (activeVideo && activeVideo.paused) {
        activeVideo.play().catch(function(e){ console.log('play on click:', e); });
      }
    }, { once: false });

    Object.keys(markers).forEach(function(pattName) {
      var marker = document.createElement('a-marker');
      marker.setAttribute('type', 'pattern');
      marker.setAttribute('url', pattName + '.patt');

      marker.addEventListener('markerFound', function() {
        if (activeMarkerName === pattName && activeVideo) {
          // Уже играет — просто пробуем возобновить, если на паузе
          if (activeVideo.paused) {
            activeVideo.play().catch(function(){});
          }
          return;
        }

        // Удаляем предыдущее
        if (activeVideo) {
          try { activeVideo.pause(); } catch(e){}
          if (activeVideo.parentNode) activeVideo.parentNode.removeChild(activeVideo);
          activeVideo = null;
        }
        document.querySelectorAll('a-video').forEach(function(el) {
          if (el.parentNode) el.parentNode.removeChild(el);
        });

        // Создаём новое видео
        var video = document.createElement('video');
        video.src = markers[pattName];
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('playsinline', '');
        video.className = 'hidden-video';
        document.body.appendChild(video);
        activeVideo = video;
        activeMarkerName = pattName;

        // Привязываем a-video к маркеру
        var aVideo = document.createElement('a-video');
        aVideo.setAttribute('src', video);
        aVideo.setAttribute('position', '0 0 0');
        aVideo.setAttribute('width', '3');
        aVideo.setAttribute('height', '1.7');
        aVideo.setAttribute('rotation', '-90 0 0');
        marker.appendChild(aVideo);

        // Ждём загрузки данных, потом пробуем play
        video.addEventListener('loadeddata', function() {
          setTimeout(function() {
            video.play().then(function() {
              // Заиграло — скрываем кнопку и подсказку
              playBtn.style.display = 'none';
              tapHint.style.display = 'none';
            }).catch(function(e) {
              console.log('Автоплей заблокирован:', e);
              // Показываем кнопку — если пользователь уже касался, автозапуск пойдёт сразу
              if (userInteracted) {
                playBtn.style.display = 'block';
              } else {
                playBtn.style.display = 'block';
                tapHint.style.display = 'block';
              }
            });
          }, 300);
        });

        // Резервный вызов play сразу после загрузки
        video.load();
      });

      marker.addEventListener('markerLost', function() {
        if (activeMarkerName !== pattName) return;
        var aVid = marker.querySelector('a-video');
        if (aVid && aVid.parentNode) aVid.parentNode.removeChild(aVid);
        if (activeVideo) {
          try { activeVideo.pause(); } catch(e){}
          if (activeVideo.parentNode) activeVideo.parentNode.removeChild(activeVideo);
          activeVideo = null;
        }
        activeMarkerName = null;
        playBtn.style.display = 'none';
      });

      container.appendChild(marker);
    });

    // Кнопка play — принудительный запуск
    playBtn.onclick = function() {
      if (activeVideo) {
        activeVideo.play().then(function() {
          playBtn.style.display = 'none';
          tapHint.style.display = 'none';
        }).catch(function(e) {
          console.log('Ошибка запуска:', e);
        });
      }
    };

    // Растягиваем видеофон камеры
    function fixARVideo() {
      document.querySelectorAll('video').forEach(function(v) {
        if (v.src && v.src.indexOf('.mp4') !== -1) return;
        v.style.position='fixed'; v.style.top='0'; v.style.left='0';
        v.style.width='100vw'; v.style.height='100vh';
        v.style.objectFit='cover'; v.style.zIndex='0';
      });
      document.querySelectorAll('canvas').forEach(function(c) {
        c.style.position='fixed'; c.style.top='0'; c.style.left='0';
        c.style.width='100vw'; c.style.height='100vh';
        c.style.zIndex='1'; c.style.background='transparent'; c.style.backgroundColor='transparent';
      });
    }
    setTimeout(fixARVideo, 500);
    setTimeout(fixARVideo, 1500);
    setTimeout(fixARVideo, 3000);
    window.addEventListener('load', fixARVideo);
    window.addEventListener('resize', fixARVideo);
  </script>
</body>
</html>
