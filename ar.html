<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .arjs-video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; object-fit: cover !important; z-index: 0 !important; }
  a-scene, .a-canvas { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1 !important; background: transparent !important; background-color: transparent !important; }
  .hidden-video { position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; opacity: 0.01; }
  #backBtn { position: fixed; top: 12px; left: 12px; z-index: 999999; padding: 10px 16px; border-radius: 20px; background: #000; color: #fff; border: 1px solid #4fc3f7; font-family: Arial, sans-serif; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <button id="backBtn" onclick="window.location.replace('index.html')">← Выйти</button>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true; premultipliedAlpha: false;"
    style="width:100%; height:100%; background: transparent;">

    <a-entity id="markerContainer"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var markers = {
      '1-building': '1-building.mp4',
      '2-bridge': '2-bridge.mp4',
      '3-electric': '3-electric.mp4',
      '4-robot': '4-robot.mp4',
      '5-vehicles': '5-vehicles.mp4',
      '6-mine': '6-mine.mp4'
    };

    var container = document.getElementById('markerContainer');
    var activeVideo = null;
    var activeMarkerName = null;

    Object.keys(markers).forEach(function(pattName) {
      var marker = document.createElement('a-marker');
      marker.setAttribute('type', 'pattern');
      marker.setAttribute('url', pattName + '.patt');

      // Создаём новое видео
      marker.addEventListener('markerFound', function() {
        if (activeMarkerName === pattName && activeVideo) return;

        // Удаляем предыдущее
        if (activeVideo) {
          try { activeVideo.pause(); } catch(e){}
          if (activeVideo.parentNode) activeVideo.parentNode.removeChild(activeVideo);
          activeVideo = null;
        }
        document.querySelectorAll('a-video').forEach(function(el) {
          if (el.parentNode) el.parentNode.removeChild(el);
        });

        var video = document.createElement('video');
        video.src = markers[pattName];
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('webkit-playsinline', '');
        video.className = 'hidden-video';
        document.body.appendChild(video);
        activeVideo = video;
        activeMarkerName = pattName;

        // КЛЮЧЕВОЕ: создаём a-video только ПОСЛЕ загрузки данных видео
        video.addEventListener('loadeddata', function() {
          var aVideo = document.createElement('a-video');
          aVideo.setAttribute('src', video);
          aVideo.setAttribute('position', '0 0 0');
          aVideo.setAttribute('width', '3');
          aVideo.setAttribute('height', '1.7');
          aVideo.setAttribute('rotation', '-90 0 0');
          marker.appendChild(aVideo);

          // Пытаемся запустить
          video.play().catch(function(e){ console.log('play:', e); });
        });

        video.load();
      });

      marker.addEventListener('markerLost', function() {
        if (activeMarkerName !== pattName) return;
        var aVid = marker.querySelector('a-video');
        if (aVid && aVid.parentNode) aVid.parentNode.removeChild(aVid);
        if (activeVideo) {
          try { activeVideo.pause(); } catch(e){}
          if (activeVideo.parentNode) activeVideo.parentNode.removeChild(activeVideo);
          activeVideo = null;
        }
        activeMarkerName = null;
      });

      container.appendChild(marker);
    });

    function fixARVideo() {
      document.querySelectorAll('video').forEach(function(v) {
        if (v.src && v.src.indexOf('.mp4') !== -1) return;
        v.style.position='fixed'; v.style.top='0'; v.style.left='0';
        v.style.width='100vw'; v.style.height='100vh';
        v.style.objectFit='cover'; v.style.zIndex='0';
      });
      document.querySelectorAll('canvas').forEach(function(c) {
        c.style.position='fixed'; c.style.top='0'; c.style.left='0';
        c.style.width='100vw'; c.style.height='100vh';
        c.style.zIndex='1'; c.style.background='transparent'; c.style.backgroundColor='transparent';
      });
    }
    setTimeout(fixARVideo, 500);
    setTimeout(fixARVideo, 1500);
    setTimeout(fixARVideo, 3000);
    window.addEventListener('load', fixARVideo);
    window.addEventListener('resize', fixARVideo);
  </script>
</body>
</html>
